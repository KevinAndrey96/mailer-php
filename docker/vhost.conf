<VirtualHost *:8080>
    DocumentRoot /var/www/app/public
    PassEnv SMTP_HOST SMTP_PORT SMTP_ENCRYPTION SMTP_USERNAME SMTP_PASSWORD MAIL_FROM_ADDRESS MAIL_FROM_NAME API_TOKEN ALLOWED_RECIPIENT_DOMAINS MAX_RECIPIENTS ALLOWED_ORIGINS

    <Directory /var/www/app/public>
        AllowOverride None
        Require all granted
        Options -Indexes
        CGIPassAuth On
        FallbackResource /index.php
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
