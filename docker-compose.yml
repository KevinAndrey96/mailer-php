services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-none}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SMTP Mailer API}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      ALLOWED_RECIPIENT_DOMAINS: ${ALLOWED_RECIPIENT_DOMAINS:-example.com}
      MAX_RECIPIENTS: ${MAX_RECIPIENTS:-10}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      mailpit:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
